name: Update Paula Schmitt dataset

permissions:
  contents: write

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Paula Schmitt scraper
        run: python scripts/paula_schmitt_scraper.py --log-level WARNING

      - name: Commit dataset updates
        run: |
          if git diff --quiet -- data/paula-schmitt-network-v2.json; then
            echo "No dataset changes detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/paula-schmitt-network-v2.json
            git commit -m "chore: update Paula Schmitt dataset"
            git push
          fi
