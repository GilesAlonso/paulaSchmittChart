name: Update Paula Schmitt dataset

permissions:
  contents: write

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.ACTION_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Paula Schmitt scraper
        run: python scripts/paula_schmitt_scraper.py --log-level WARNING

      - name: Check for dataset changes
        id: changes
        run: |
          if git diff --quiet -- data/paula-schmitt-network-v2.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No dataset changes detected."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Dataset changes detected."
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GilesAlonso"
          git config --global user.email "giles.g.alonso@gmail.com"
          git add .
          git commit -m "chore: update Paula Schmitt dataset [automated]"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changes == 'false'
        run: |
          echo "✅ No dataset changes detected. Skipping commit."
